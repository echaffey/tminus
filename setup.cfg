# Declarative setuptools config, readable by the setuptools bundled with Python 3.7.
# Install offline (no PyPI): pip install --no-index --no-build-isolation .
[metadata]
name = tminus
version = attr: tminus.__version__
description = Schedule, monitor, modify, clean up after, and report on Slurm jobs.
long_description = file: README.md
long_description_content_type = text/markdown
author = Evan Chaffey
url = https://github.com/echaffey/tminus
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Operating System :: POSIX :: Linux
    Topic :: System :: Distributed Computing

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.7

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    tminus = tminus.cli:main
